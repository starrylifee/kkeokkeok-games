<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꺾꺾 게임공장</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="꺾꺾 게임공장">
<meta property="og:title" content="꺾꺾 게임공장">
<meta property="og:description" content="초등 4학년 개념게임 — 꺾은선그래프 조립 · 먹이사슬 실험 · 서울 자랑 큐레이션">
<meta property="og:url" content="https://kkeokkeok-games.vercel.app/">
<meta property="og:image" content="https://kkeokkeok-games.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#F5F2FE; --card:#FFFFFF; --ink:#2E2849; --muted:#7A72A0;
  --line:#E7E1FA; --grid:#D9D2F2;
  --purple:#7A49FF; --purple-deep:#5730C9; --purple-soft:#EDE6FF;
  --coral:#FF8A7A; --sun:#FFD35C; --mint:#3FBF9C; --mint-soft:#E2F8F1;
  --shadow:0 10px 24px rgba(87,48,201,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
  color:var(--ink); background:var(--bg);
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);
  background-size:24px 24px;
}
#app{max-width:860px;margin:0 auto;padding:36px 20px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
header svg{width:56px;height:56px;flex:none}
h1{font-size:28px;font-weight:800;letter-spacing:.01em;margin:0}
h1 b{color:var(--purple-deep)}
h1 .zz{color:var(--coral)}
.tagline{margin:2px 0 26px;color:var(--muted);font-weight:700;font-size:15px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.games{grid-template-columns:1fr}}
.gcard{display:flex;flex-direction:column;gap:10px;background:var(--card);border:2.5px solid var(--line);
  border-radius:22px;padding:20px;box-shadow:var(--shadow);text-decoration:none;color:inherit;
  transition:transform .15s}
.gcard:hover{transform:translateY(-4px);border-color:var(--purple)}
.gcard .go{width:100%;height:74px;border-radius:16px;display:grid;place-items:center;overflow:hidden}
.gcard .go svg{width:100%;height:100%}
.gcard h2{margin:0;font-size:19px;font-weight:800}
.gcard p{margin:0;font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.5}
.gcard .tag{align-self:flex-start;font-size:12px;font-weight:800;border-radius:999px;padding:4px 12px}
.tag.play{background:var(--mint-soft);color:var(--mint)}
footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#7A49FF"/>
      <polyline points="10,44 24,28 36,36 54,16" fill="none" stroke="#FFD35C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="54" cy="16" r="5" fill="#fff"/>
    </svg>
    <div>
      <h1><b>꺾꺾</b> <span class="zz">게임공장</span></h1>
      <p class="tagline">개념의 뿌리를 뚫는 초등 4학년 수업 게임</p>
    </div>
  </header>

  <div class="games">
    <a class="gcard" href="artifacts/graph-factory.html">
      <span class="tag play">플레이 가능</span>
      <div class="go">
        <svg viewBox="0 0 300 74" aria-hidden="true">
          <rect width="300" height="74" fill="#EDE6FF"/>
          <line x1="30" y1="60" x2="280" y2="60" stroke="#B9AEE8" stroke-width="2"/>
          <polyline points="40,50 100,34 160,42 220,18 275,30" fill="none" stroke="#7A49FF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="40" cy="50" r="6" fill="#5730C9"/><circle cx="100" cy="34" r="6" fill="#5730C9"/>
          <circle cx="160" cy="42" r="6" fill="#5730C9"/><circle cx="220" cy="18" r="6" fill="#5730C9"/>
          <circle cx="275" cy="30" r="6" fill="#5730C9"/>
        </svg>
      </div>
      <h2>꺾꺾 조립공장</h2>
      <p>꺾은선그래프 · 점 찍고 선 잇고 기울기 읽기. 수학 4학년 시간의 흐름 자료 4종.</p>
    </a>

    <a class="gcard" href="artifacts/foodchain-lab.html">
      <span class="tag play">플레이 가능</span>
      <div class="go">
        <svg viewBox="0 0 300 74" aria-hidden="true">
          <rect width="300" height="74" fill="#E2F8F1"/>
          <circle cx="46" cy="30" r="16" fill="#FFD35C"/>
          <rect x="96" y="36" width="30" height="20" rx="6" fill="#3FBF9C"/>
          <rect x="150" y="26" width="30" height="30" rx="8" fill="#7A49FF"/>
          <rect x="204" y="14" width="34" height="42" rx="10" fill="#5730C9"/>
        </svg>
      </div>
      <h2>먹이사슬 실험실</h2>
      <p>생태계 · 태양빛에서 시작하는 에너지 흐름을 조립하고, 한 생물을 빼보는 실험.</p>
    </a>

    <a class="gcard" href="artifacts/seoul-curator.html">
      <span class="tag play">플레이 가능</span>
      <div class="go">
        <svg viewBox="0 0 300 74" aria-hidden="true">
          <rect width="300" height="74" fill="#FFE9E6"/>
          <path d="M40 56 L70 20 L100 56 Z" fill="#FF8A7A"/>
          <rect x="128" y="30" width="46" height="30" rx="4" fill="#7A49FF"/>
          <rect x="134" y="36" width="34" height="18" rx="2" fill="#FFD35C"/>
          <path d="M208 60 q14 -34 28 0" fill="none" stroke="#5730C9" stroke-width="5" stroke-linecap="round"/>
          <circle cx="248" cy="24" r="7" fill="#3FBF9C"/>
        </svg>
      </div>
      <h2>서울 자랑 큐레이터</h2>
      <p>사회 · 방문객 요청서에 맞춰 서울 자랑 카드를 전시하고 가짜 자랑은 걸러내기.</p>
    </a>
  </div>

  <footer>초등 4학년 수업용 · 학생 개인정보 수집 없음</footer>
</div>
</body>
</html>
